<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Shiloh 2026 Payments</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f3ed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #f5f3ed;
      }

      main {
        display: flex;
        justify-content: center;
        width: 100%;
        padding: 24px 12px 48px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      iframe {
        display: block;
        width: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Shiloh 2026 Payments</h1>
      <script src="https://donorbox.org/widget.js" paypalExpress="true"></script>
      <iframe
        src="https://donorbox.org/embed/shiloh2026-payments?"
        name="donorbox"
        title="Shiloh 2026 secure payment form"
        allowpaymentrequest="allowpaymentrequest"
        seamless="seamless"
        frameborder="0"
        scrolling="no"
        height="900px"
        width="100%"
        style="max-width: 500px; min-width: 250px; max-height: none !important"
        allow="payment"
      ></iframe>
    </main>
  </body>
</html>
